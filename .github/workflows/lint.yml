name: Lint & Format

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff and black
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff black
      - name: Run ruff (lint)
        run: ruff check QR/ --output-format=github
      - name: Run black (check format)
        run: black --check QR/
      - name: Run ruff format (auto-fix)
        run: ruff format QR/ --check
        continue-on-error: true
